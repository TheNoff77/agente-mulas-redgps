name: Reporte Diario RedGPS

on:
  schedule:
    # 10:30 PM hora de Colombia (UTC-5) = 03:30 UTC
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  ejecutar-reporte:
    name: Extraer KML y Enviar Reporte Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium y dependencias del sistema de Playwright
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar Agente Automatico RedGPS
        env:
          TZ: 'America/Bogota'
          REDGPS_USER: ${{ secrets.REDGPS_USER }}
          REDGPS_PASSWORD: ${{ secrets.REDGPS_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
        run: |
          python agente_redgps_automatico.py
